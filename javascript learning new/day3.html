<body>
    <script>
        // Arithmatic operaters
        // addition
        let a = 10;
        let b = 5;
        console.log(a+b);

        //substraction
        console.log(a-b);

        //multiplication
        console.log(a*b);

        //division
        console.log(20/4);

        //modulas
        console.log(10%3);

        // exponent
        console.log(2**3);

        // Assignment operater
        // basic assignment
        let x1 = 10;
        console.log("other")
        // other operations
        let x = 40;
        x += 5; // 45
        console.log(x);
        x -= 5; // 40
        console.log(x);
        x *= 5; // 200
        console.log(x);
        x /= 5; // 40
        console.log(x);

        // comparison operators
        // equal
        console.log(5 == 5);    // true
        console.log(5 == "5");  // true
        console.log(5 === "5"); // false
        console.log(5 !== 5);   // false
        console.log(5 > 20);    
        console.log(6<=6);
        console.log(5 === "5");

        // logical operators
        // AND operator
        console.log(5 === 5 && 5 >3);
        console.log(true && false);

        // OR Operator
        console.log(true || false);

        // NOT operator
        console.log(`Not operator true -> ${!true}`);

        // Increment and Decrement
        let count = 5;
        count++;
        console.log(count);
        count--;
        count--;
        x= count--;
        console.log(count);
        console.log(x);
        y = ++count + 2;
        console.log(y);

        // String concatenation

        const firstName = "Yehan";
        const lastName = "Pathiratne";
        console.log(firstName+" "+lastName)

        // ternary operator
        // condition? trueValue : falseValue

        let age = 21;
        console.log(age.name);
        let result = age > 20 ? "Adult" : "Minor"
        console.log(result);

        // Nullish coalesing
        let userName = null;
        console.log(userName ?? "Guest");

        // optional chaining 
        let user = null;
        console.log(user?.name);

        let details ={ name:null};
        console.log(details?.name);

        console.log(10/0);

        console.log(typeof ("5"+1));
