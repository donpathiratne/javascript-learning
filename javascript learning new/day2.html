<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Variables and data types</title>
    </head>
    <body>
        <script>
            let age=20;
            console.log(age);
            age = 22;
            console.log(age);

            const country = "Sri Lanka";
            console.log(country);

            var city = "Moratuwa";
            console.log(city);

            let isStudent = true;
            console.log(isStudent);

            let game;
            console.log(game);

            let selectedUser = null;
            console.log(selectedUser);
            
            // check datatype

            console.log(typeof country);
            console.log(typeof isStudent);
            console.log(typeof game);
            console.log(typeof selectedUser);

            // javascript is dynamically typed
            // it means data type of vaue can be changed
            
            let data= "Hello";
            console.log(typeof data);
            data = 20;
            console.log(typeof data);

            // template literals
            // modern way to combine string
            let name = "Yehan";
            console.log(`Hello ${name}`);
            let ageNew = 20;
            console.log(`My age is ${ageNew}.`);
            let city1 = "Moratuwa";
            console.log(`I am from ${city1}.`);

            // "Double Quotes"
            // 'single quotes'
            // `backticks`

            // 19 real example program

            let studentName = "Yehan";
            //let Age = 20;
            let isStudentN = true;

            console.log(studentName);
            //console.log(Age);
            console.log(isStudentN);

            // Practice 
            // Task 1
            let Name = "Yehan";
            let AgeNew = 20;
            let countryN = "Sri Lanka";

            console.log(Name);
            console.log(AgeNew);
            console.log(countryN);

            // Task 2
            console.log(typeof Name);
            console.log(typeof AgeNew);
            console.log(typeof countryN);

            // Task 3
            console.log(`Hello, my name is ${Name} and I am ${AgeNew} years old.`);
            </script>
    </body>
</html>
